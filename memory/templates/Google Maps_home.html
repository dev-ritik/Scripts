{% extends "base.html" %}
{% block title %}Home | Google Maps Insights{% endblock %}

{% block extra_style %}

<style>

    /* ================================
       Google Maps Inspired Theme
    ================================ */

.section-title {
    padding: 22px 20px;
    font-weight: 700;
    font-size: 19px;
    color: #202124;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 10px;
}

    .sidebar .section-title::before {
        content: "📍";
        font-size: 21px;
}

.place-item {
    padding: 14px 14px;
    margin-bottom: 6px;
    border-radius: 12px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s ease;
    position: relative;
}

.place-item:hover {
    background: #e8f0fe;
    border-color: #d2e3fc;
    transform: translateX(3px);
}

.place-name {
    font-weight: 600;
    font-size: 14px;
    color: #202124;
}

.place-visits {
    color: #5f6368;
    font-size: 12px;
    margin-top: 5px;
}

    /* Scrollbar */
    .place-list::-webkit-scrollbar,
    #cityTimeline::-webkit-scrollbar {
        width: 6px;
    }

    .place-list::-webkit-scrollbar-thumb,
    #cityTimeline::-webkit-scrollbar-thumb {
        background: #dadce0;
        border-radius: 10px;
}

    /* Leaflet controls */
    .leaflet-bar {
        border: none !important;
        border-radius: 10px !important;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(60, 64, 67, 0.2) !important;
    }

    .leaflet-bar a {
        color: #1a73e8 !important;
        border-bottom: 1px solid #eee !important;
    }

    .leaflet-popup-content-wrapper {
        border-radius: 12px !important;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
    }

    .leaflet-popup-content {
        margin: 14px 18px !important;
        color: #202124;
        font-size: 13px;
        line-height: 1.6;
    }

    /* ================================
       City Timeline
    ================================ */

    .timeline-container {
        padding: 28px 32px;
        background: linear-gradient(135deg, #f8fbff, #edf4ff);
        border-top: 1px solid #dce7f7;
    }

    .timeline-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 18px;
    }

    .timeline-header .section-title {
        padding: 0;
        font-size: 21px;
    }

    .timeline-header .section-title::before {
        content: "🌍";
    }

    .timeline-controls {
        display: flex;
        gap: 10px;
    }

    .timeline-controls input,
    .timeline-controls select {
        padding: 10px 14px;
        border: 1px solid #dadce0;
        border-radius: 10px;
        background: white;
        color: #3c4043;
        font-size: 13px;
        outline: none;
        transition: all 0.2s;
        box-shadow: 0 1px 3px rgba(60, 64, 67, 0.08);
    }

    .timeline-controls input:focus,
    .timeline-controls select:focus {
        border-color: #1a73e8;
        box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.12);
    }

    .timeline-controls input {
        min-width: 190px;
    }

    #cityTimeline {
        margin-top: 12px;
        max-height: 550px;
        overflow-y: auto;
        padding: 0 12px 12px;
    }

    /* Year separators */
    .timeline-year {
        font-size: 17px;
        font-weight: 700;
        color: #1967d2;
        padding: 18px 0 10px;
        margin-top: 8px;
        border-bottom: 2px solid #d2e3fc;
        position: sticky;
        top: 0;
        background: #f5f9ff;
        z-index: 1;
    }

    /* Timeline entries */
    .timeline-entry {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        margin: 5px 0;
        gap: 20px;
        border-radius: 10px;
        border: 1px solid transparent;
        transition: all 0.2s ease;
        position: relative;
    }

    .timeline-entry:hover {
        background: white;
        border-color: #d2e3fc;
        box-shadow: 0 2px 8px rgba(60, 64, 67, 0.08);
        transform: translateX(3px);
    }

    .timeline-date {
        width: 110px;
        flex-shrink: 0;
        color: #80868b;
        font-size: 12px;
        font-weight: 500;
    }

    .timeline-city {
        font-weight: 600;
        color: #202124;
        font-size: 14px;
    }

    /* Load more */
    .timeline-footer {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        padding: 20px;
        color: #5f6368;
        font-size: 13px;
    }

    #loadMoreCities {
        padding: 10px 22px;
        border: none;
        background: #1a73e8;
        color: white;
        font-weight: 600;
        border-radius: 22px;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 2px 5px rgba(26, 115, 232, 0.25);
    }

    #loadMoreCities:hover:not(:disabled) {
        background: #1558b0;
        box-shadow: 0 4px 10px rgba(26, 115, 232, 0.3);
        transform: translateY(-1px);
    }

    #loadMoreCities:disabled {
        background: #dadce0;
        color: #80868b;
        box-shadow: none;
        cursor: default;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .timeline-container {
            padding: 20px 14px;
        }

        .timeline-controls {
            width: 100%;
        }

        .timeline-controls input {
            min-width: 0;
            flex: 1;
        }
    }

    .ig-layout {
        display: grid !important;
        grid-template-columns: 360px minmax(0, 1fr) !important;
        grid-template-rows: minmax(0, 1fr);
        width: 100%;
        height: calc(100vh - 60px);
        min-height: 500px;
        overflow: hidden;
        flex-shrink: 0;
        background: #e8f0fe;
    }

    .sidebar {
        grid-column: 1;
        grid-row: 1;
        width: 360px !important;
        min-width: 360px !important;
        max-width: 360px;
        height: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: white;
        border-right: 1px solid #e0e5ec;
        box-shadow: 3px 0 15px rgba(60, 64, 67, 0.08);
        z-index: 2;
    }

    .place-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
    }

    .map-container {
        grid-column: 2;
        grid-row: 1;
        width: 100%;
        min-width: 0;
        height: 100%;
        padding: 22px;
        box-sizing: border-box;
        overflow: hidden;
        background: #e8f0fe;
    }

    .map-card {
        width: 100%;
        height: 100%;
        min-height: 0;
        box-sizing: border-box;
        border-radius: 18px;
        overflow: hidden;
        background: white;
        box-shadow: 0 2px 6px rgba(60, 64, 67, 0.10),
        0 8px 24px rgba(60, 64, 67, 0.12);
    }

    #map {
        width: 100%;
        height: 100%;
    }

</style>
{% endblock %}

{% block extra_head %}
<link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
{% endblock %}


{% block content %}
<div class="ig-layout">

    <div class="sidebar">

        <div class="section-title">
            Most Visited Places
        </div>

        <div id="placeList" class="place-list">
        </div>

    </div>

    <div class="map-container">
        <div class="map-card">
            <div id="map"></div>
        </div>
    </div>

</div>

<div class="timeline-container">
    <div class="timeline-header">
        <div class="section-title">City Timeline</div>

        <div class="timeline-controls">
            <input
                    type="text"
                    id="citySearch"
                    placeholder="Search city..."
            >

            <select id="yearFilter">
                <option value="all">All years</option>
            </select>
        </div>
    </div>

    <div id="cityTimeline"></div>

    <div class="timeline-footer">
        <button id="loadMoreCities">Load more</button>
        <span id="timelineCount"></span>
    </div>
</div>

<script>

    document.addEventListener("DOMContentLoaded", function () {

        const map = L.map("map").setView([22.5, 79], 5);

        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '© OpenStreetMap'
            }
        ).addTo(map);

        loadLocations(map);

    });

    function loadLocations(map) {
        const request = new XMLHttpRequest();
        request.open("GET", "/Google Maps/get_location_clustering", false); // synchronous
        request.send(null);

        if (request.status !== 200) {
            console.error("Failed to load locations");
            return;
        }

        const places = JSON.parse(request.responseText);

        const sidebar = document.getElementById("placeList");

        const bounds = [];

        places.forEach(function (place) {

            const latlng = [place.latitude, place.longitude];

            bounds.push(latlng);

            const marker = L.marker(latlng)
                .addTo(map)
                .bindPopup(
                    "<b>" + place.name + "</b><br>" +
                    place.visits + " visits"
                );

            const item = document.createElement("div");
            item.className = "place-item";

            item.innerHTML =
                '<div class="place-name">' + place.name + '</div>' +
                '<div class="place-visits">' + place.visits + ' visits</div>';

            item.onclick = function () {
                map.flyTo(latlng, 15);
                marker.openPopup();
            };

            sidebar.appendChild(item);

        });

        if (bounds.length > 0) {
            map.fitBounds(bounds, {
                padding: [60, 60]
            });
        }

    }

    let cityTimelineData = [];
    let filteredTimelineData = [];
    let visibleCities = 50;

    const PAGE_SIZE = 50;

    async function loadCityTimeline() {
        try {
            const response = await fetch(
                "/Google%20Maps/get_city_timeline"
            );

            if (!response.ok) {
                throw new Error("Failed to load city timeline");
            }

            cityTimelineData = await response.json();

            // Sort newest first
            cityTimelineData.sort(
                (a, b) => new Date(b[0]) - new Date(a[0])
            );

            populateYearFilter();
            filterCityTimeline();

        } catch (error) {
            console.error(error);
            document.getElementById("cityTimeline").textContent =
                "Unable to load city timeline.";
        }
    }

    function populateYearFilter() {
        const yearFilter = document.getElementById("yearFilter");

        const years = [...new Set(
            cityTimelineData.map(entry =>
                new Date(entry[0]).getFullYear()
            )
        )].sort((a, b) => b - a);

        years.forEach(year => {
            const option = document.createElement("option");
            option.value = year;
            option.textContent = year;
            yearFilter.appendChild(option);
        });
    }

    function filterCityTimeline() {
        const search = document.getElementById("citySearch")
            .value.trim().toLowerCase();

        const selectedYear = document.getElementById("yearFilter").value;

        filteredTimelineData = cityTimelineData.filter(entry => {
            const date = new Date(entry[0]);
            const city = entry[1] || "";

            return (
                (!search || city.toLowerCase().includes(search)) &&
                (selectedYear === "all" ||
                    date.getFullYear() === Number(selectedYear))
            );
        });

        visibleCities = PAGE_SIZE;
        renderCityTimeline();
    }

    function renderCityTimeline() {
        const container = document.getElementById("cityTimeline");
        container.replaceChildren();

        const entries = filteredTimelineData.slice(0, visibleCities);

        let currentYear = null;

        entries.forEach(([timestamp, city]) => {
            const date = new Date(timestamp);
            const year = date.getFullYear();

            if (year !== currentYear) {
                currentYear = year;

                const heading = document.createElement("div");
                heading.className = "timeline-year";
                heading.textContent = year;

                container.appendChild(heading);
            }

            const item = document.createElement("div");
            item.className = "timeline-entry";

            const dateElement = document.createElement("div");
            dateElement.className = "timeline-date";

            dateElement.textContent = date.toLocaleDateString("en-IN", {
                day: "2-digit",
                month: "short"
            });

            const cityElement = document.createElement("div");
            cityElement.className = "timeline-city";
            cityElement.textContent = city;

            item.append(dateElement, cityElement);
            container.appendChild(item);
        });

        document.getElementById("timelineCount").textContent =
            `Showing ${entries.length} of ${filteredTimelineData.length}`;

        document.getElementById("loadMoreCities").disabled =
            visibleCities >= filteredTimelineData.length;
    }

    // Event listeners
    document.getElementById("citySearch")
        .addEventListener("input", filterCityTimeline);

    document.getElementById("yearFilter")
        .addEventListener("change", filterCityTimeline);

    document.getElementById("loadMoreCities")
        .addEventListener("click", () => {
            visibleCities += PAGE_SIZE;
            renderCityTimeline();
        });

    document.addEventListener("DOMContentLoaded", loadCityTimeline);

</script>
{% endblock %}
