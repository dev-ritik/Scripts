{% extends "base.html" %}
{% block title %}Chat Circles{% endblock %}
{% block content %}

<style>
    body {
        background: #fdf7ef;
        font-family: "Inter", sans-serif;
        text-align: center;
    }

    h1 {
        margin-top: 1rem;
        font-size: 2rem;
        font-weight: 700;
    }

    .dropdown {
        margin: 1rem 0 5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
    }

    .dropdown label {
        font-weight: 600;
        font-size: 1.1rem;
        color: #333;
    }

    #range {
        padding: 0.6rem 1rem;
        font-size: 1rem;
        border: 2px solid #ddd;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
        transition: all 0.2s ease;
        cursor: pointer;
        outline: none;
    }

    #range:hover {
        border-color: #33b37a;
        box-shadow: 0 3px 8px rgba(51, 179, 122, 0.2);
    }

    #range:focus {
        border-color: #33b37a;
        box-shadow: 0 0 0 3px rgba(51, 179, 122, 0.2);
    }

    .custom-date-range {
        display: none;
        flex-direction: row;
        align-items: center;
        gap: 1rem;
        margin-top: 0.5rem;
        animation: fadeIn 0.3s ease;
    }

    .custom-date-range label {
        font-weight: 500;
        font-size: 0.95rem;
    }

    .custom-date-range input[type="date"] {
        padding: 0.4rem 0.6rem;
        font-size: 0.95rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        background: #fff;
        outline: none;
        transition: border-color 0.2s ease;
    }

    .custom-date-range input[type="date"]:focus {
        border-color: #33b37a;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(-5px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .orbit-container {
        position: relative;
        width: 500px;
        height: 500px;
        margin: 0 auto;
    }

    .orbit {
        position: absolute;
        top: 50%;
        left: 50%;
        border: 2px dashed transparent;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        animation: spin 30s linear infinite;
        pointer-events: none
    }

    .orbit1 {
        width: 240px;
        height: 240px;
        border-color: #ff7d33;
        animation-duration: 20s;
    }

    .orbit2 {
        width: 400px;
        height: 400px;
        border-color: #ffd54a;
        animation-duration: 28s;
    }

    .orbit3 {
        width: 560px;
        height: 560px;
        border-color: #82b1ff;
        animation-duration: 36s;
    }

    @keyframes spin {
        from {
            transform: translate(-50%, -50%) rotate(0deg);
        }
        to {
            transform: translate(-50%, -50%) rotate(360deg);
        }
    }

    .orbit img {
        position: absolute;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 3px solid white;
        object-fit: cover;
        transform: translate(-50%, -50%);
        transition: transform 0.3s;
        cursor: pointer;
        pointer-events: auto;
    }

    .orbit img:hover {
        transform: translate(-50%, -50%) scale(2);
    }

    .center-avatar {
        position: absolute; /* center it */
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 120px;
        height: 120px;
        border-radius: 50%;
        overflow: hidden;
        border: 4px solid #33b37a;
        z-index: 2; /* keep it above orbits */
    }

    .center-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .common-words {
        margin-top: 2rem;
        background: rgba(255, 255, 255, 0.08);
        padding: 1.5rem;
        border-radius: 1rem;
        width: 90%;
        max-width: 400px;
        margin-left: auto;
        margin-right: auto;
        text-align: center;
        backdrop-filter: blur(8px);
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
    }

    .common-words h3 {
        margin-bottom: 1rem;
        color: #ffd54a;
    }

    .charts-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 24px;
        margin-top: 20px;
    }

    canvas {
        width: 100%;
        height: 180px;
    }

    h4 {
        color: #aaa;
        font-weight: 500;
        margin-bottom: 8px;
    }

    .moving-average-player {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        margin-top: 12px;
    }

    .moving-average-player button {
        border: none;
        background: none;
        cursor: pointer;
        font-size: 20px;
        padding: 4px 8px;
    }

    .moving-average-player button:hover {
        transform: scale(1.1);
    }

    .moving-average-slider {
        flex: 1;
        cursor: pointer;
    }

    .moving-average-date {
        min-width: 75px;
        text-align: right;
        font-size: 14px;
        font-weight: 500;
    }

</style>

<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    let start_date, end_date;
    const rangeSelect = document.getElementById("range");
    const customInputs = document.getElementById("customDateInputs");
    const fromDate = document.getElementById("fromDate");
    const toDate = document.getElementById("toDate");

    function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    // Helper: get start & end dates for a preset range
    function getDateRange(range) {
        const today = new Date();
        let start, end;

        switch (range) {
            case "week":
                end = new Date(today);
                start = new Date();
                start.setDate(end.getDate() - 7);
                break;

            case "month":
                end = new Date(today);
                start = new Date(today.getFullYear(), today.getMonth() - 1, today.getDate());
                break;

            case "quarter":
                end = new Date(today);
                start = new Date(today.getFullYear(), today.getMonth() - 3, today.getDate());
                break;

            case "2020":
            case "2021":
            case "2022":
            case "2023":
            case "2024":
            case "2025":
            case "2026":
                start = new Date(parseInt(range), 0, 1);
                end = new Date(parseInt(range), 11, 31);
                break;

            default:
                return null;
        }

        start_date = formatDate(start)
        end_date = formatDate(end)
        return {
            start_date: formatDate(start),
            end_date: formatDate(end),
        };
    }

    async function loadData() {
        const range = rangeSelect.value;

        let start_date = "", end_date = "";

        if (range === "custom") {
            const fromDate = document.getElementById("fromDate");
            const toDate = document.getElementById("toDate");

            start_date = fromDate.value;
            end_date = toDate.value;

            // ✅ If user hasn’t selected both dates yet, stop here
            if (!start_date || !end_date) {
                console.log("Waiting for valid custom dates...");
                return;
            }

            // ✅ Optional: Validate logical order
            if (new Date(start_date) > new Date(end_date)) {
                console.warn("Invalid date range — start is after end.");
                return;
            }
        } else {
            const rangeData = getDateRange(range);
            if (rangeData) {
                start_date = rangeData.start_date;
                end_date = rangeData.end_date;
            } else {
                // fallback safety
                return;
            }
        }

        const query = new URLSearchParams({start_date, end_date}).toString();
        const res = await fetch(`/circle_data?${query}`);
        const data = await res.json();

        renderCircles(data.people);
        await renderMovingAverageChart(data.people)
        await renderMovingAverageChartDynamic(data.people)
    }

    async function renderMovingAverageChartDynamic(people) {
        const chartContainer = document.getElementById("weekly-chart-dynamic");

        const allWeeks = Array.from(
            new Set(
                people.flatMap(p =>
                    Object.keys(p.chat_times.weekly_counts)
                )
            )
        ).sort();

        if (allWeeks.length < 7) {
            if (movingAvgChartDynamic) {
                movingAvgChartDynamic.destroy();
                movingAvgChartDynamic = null;
            }

            if (chartContainer) {
                chartContainer.style.display = "none";
            }

            return;
        }

        if (chartContainer) {
            chartContainer.style.display = "";
        }

        if (movingAvgChartDynamic) {
            movingAvgChartDynamic.destroy();
            movingAvgChartDynamic = null;
        }

        const MA_WINDOW = 7;
        const DISPLAY_WEEKS = 5;
        const TOP_N = 8;

        // Faster animation
        const STEP_TIME = 600;

        /*
         * ------------------------------------------------------------
         * 1. ALL PEOPLE
         * ------------------------------------------------------------
         */

        const allPeople = [...people];

        /*
         * ------------------------------------------------------------
         * 3. 7-WEEK MOVING AVERAGES
         * ------------------------------------------------------------
         */

        const movingAverages = allPeople.map(p => {

            const weekly = p.chat_times.weekly_counts;

            return allWeeks.map((week, i) => {

                if (i < MA_WINDOW - 1) {
                    return null;
                }

                let sum = 0;

                for (
                    let j = i - MA_WINDOW + 1;
                    j <= i;
                    j++
                ) {
                    sum += weekly[allWeeks[j]] ?? 0;
                }

                return sum / MA_WINDOW;
            });
        });

        /*
         * ------------------------------------------------------------
         * 4. FIXED Y AXIS
         *
         * Calculated across ALL people and ALL frames.
         * ------------------------------------------------------------
         */

        const allValues = movingAverages
            .flat()
            .filter(v => v !== null && v > 0);

        const minValue =
            allValues.length > 0
                ? Math.min(...allValues)
                : 1;

        const maxValue =
            allValues.length > 0
                ? Math.max(...allValues)
                : 10;

        const yMin = Math.max(
            1,
            Math.floor(minValue * 0.7)
        );

        const yMax = Math.max(
            yMin + 1,
            Math.ceil(maxValue * 1.3)
        );


        /*
         * ------------------------------------------------------------
         * 5. STABLE COLORS
         *
         * Every person gets one color which never changes.
         * ------------------------------------------------------------
         */

        const colors = allPeople.map(
            (_, idx) =>
                `hsl(${
                    idx * 360 /
                    Math.max(allPeople.length, 1)
                }, 70%, 55%)`
        );


        /*
         * ------------------------------------------------------------
         * 6. AVATAR CACHE
         * ------------------------------------------------------------
         */

        const avatarCache = {};

        function getPersonAvatar(name) {

            if (!avatarCache[name]) {

                const img = new Image();

                img.src =
                    `/user/dp/${encodeURIComponent(name)}`;

                img.onload = () => {

                    if (movingAvgChartDynamic) {
                        movingAvgChartDynamic.draw();
                    }
                };

                img.onerror = () => {
                    console.warn(
                        "Could not load avatar:",
                        name
                    );
                };

                avatarCache[name] = img;
            }

            return avatarCache[name];
        }


        /*
         * ------------------------------------------------------------
         * 7. TIMELINE
         * ------------------------------------------------------------
         */

        const firstFrame =
            MA_WINDOW - 1;

        const lastFrame =
            allWeeks.length - 1;

        let currentFrame =
            firstFrame;

        let isPlaying = false;

        let animationToken = 0;

        let currentWeek =
            allWeeks[currentFrame];


        /*
         * ------------------------------------------------------------
         * 8. GET TOP 8 FOR A FRAME
         * ------------------------------------------------------------
         */

        function getTopPeople(frame) {

            return allPeople
                .map((person, personIndex) => ({
                    person,
                    personIndex,
                    value:
                        movingAverages[
                            personIndex
                            ][frame]
                }))
                .filter(x =>
                    x.value !== null &&
                    x.value > 0
                )
                .sort((a, b) =>
                    b.value - a.value
                )
                .slice(0, TOP_N);
        }


        /*
         * ------------------------------------------------------------
         * 9. CURRENT WEEK PLUGIN
         * ------------------------------------------------------------
         */

        const currentWeekPlugin = {

            id: "currentWeek",

            afterDraw(chart) {

                const {
                    ctx,
                    chartArea
                } = chart;

                if (!chartArea) {
                    return;
                }

                ctx.save();

                ctx.font =
                    "bold 28px sans-serif";

                ctx.textAlign = "right";
                ctx.textBaseline = "top";
                ctx.fillStyle = "#666";

                ctx.fillText(
                    currentWeek,
                    chartArea.right,
                    8
                );

                ctx.restore();
            }
        };


        /*
         * ------------------------------------------------------------
         * 10. LINE LABELS + DP + COLLISION HANDLING
         * ------------------------------------------------------------
         */

        const lineLabelsPlugin = {

            id: "lineLabels",

            afterDatasetsDraw(chart) {

                const {
                    ctx,
                    chartArea
                } = chart;

                if (!chartArea) {
                    return;
                }

                const AVATAR_SIZE = 24;
                const LABEL_GAP = 30;

                const CONNECTOR_LENGTH = 12;
                const TEXT_GAP = 8;


                /*
                 * Collect visible datasets
                 */

                const labels = [];

                chart.data.datasets.forEach(
                    (dataset, datasetIndex) => {

                        const meta =
                            chart.getDatasetMeta(
                                datasetIndex
                            );

                        if (
                            !meta ||
                            meta.hidden
                        ) {
                            return;
                        }

                        const points =
                            meta.data;

                        if (
                            !points ||
                            points.length === 0
                        ) {
                            return;
                        }

                        const point =
                            points[
                            points.length - 1
                                ];

                        if (
                            !point ||
                            !dataset.label
                        ) {
                            return;
                        }

                        labels.push({

                            point,

                            x: point.x,

                            originalY:
                            point.y,

                            y: point.y,

                            color:
                            dataset.borderColor,

                            name:
                            dataset.label
                        });
                    }
                );


                /*
                 * Sort by actual Y position.
                 */

                labels.sort(
                    (a, b) =>
                        a.originalY -
                        b.originalY
                );


                /*
                 * Push overlapping labels apart.
                 */

                for (
                    let i = 1;
                    i < labels.length;
                    i++
                ) {

                    const previous =
                        labels[i - 1];

                    const current =
                        labels[i];

                    if (
                        current.y -
                        previous.y <
                        LABEL_GAP
                    ) {

                        current.y =
                            previous.y +
                            LABEL_GAP;
                    }
                }


                /*
                 * Keep the whole label group inside the chart.
                 */

                const topLimit =
                    chartArea.top +
                    AVATAR_SIZE / 2;

                const bottomLimit =
                    chartArea.bottom -
                    AVATAR_SIZE / 2;


                /*
                 * Shift upwards if bottom overflow occurs.
                 */

                if (labels.length > 0) {

                    const bottomOverflow =
                        labels[
                        labels.length - 1
                            ].y -
                        bottomLimit;

                    if (bottomOverflow > 0) {

                        labels.forEach(label => {
                            label.y -= bottomOverflow;
                        });
                    }
                }


                /*
                 * Shift downwards if top overflow occurs.
                 */

                if (
                    labels.length > 0 &&
                    labels[0].y < topLimit
                ) {

                    const topOverflow =
                        topLimit -
                        labels[0].y;

                    labels.forEach(label => {
                        label.y += topOverflow;
                    });
                }


                /*
                 * Draw everything.
                 */

                ctx.save();

                labels.forEach(label => {

                    const {
                        point,
                        x,
                        y,
                        color,
                        name
                    } = label;


                    /*
                     * Connector.
                     *
                     * Starts at the ACTUAL data point and ends
                     * at the displaced label.
                     */

                    ctx.beginPath();

                    ctx.moveTo(
                        point.x,
                        point.y
                    );

                    ctx.lineTo(
                        x + CONNECTOR_LENGTH,
                        y
                    );

                    ctx.strokeStyle =
                        color;

                    ctx.lineWidth = 2;

                    ctx.stroke();


                    /*
                     * Avatar position.
                     */

                    const avatarX =
                        x +
                        CONNECTOR_LENGTH +
                        AVATAR_SIZE / 2;

                    const avatarY =
                        y;


                    /*
                     * Circular avatar.
                     */

                    ctx.save();

                    ctx.beginPath();

                    ctx.arc(
                        avatarX,
                        avatarY,
                        AVATAR_SIZE / 2,
                        0,
                        Math.PI * 2
                    );

                    ctx.clip();


                    const avatar =
                        getPersonAvatar(name);


                    if (
                        avatar &&
                        avatar.complete &&
                        avatar.naturalWidth > 0
                    ) {

                        /*
                         * Preserve aspect ratio and crop
                         * into the circle.
                         */

                        const size =
                            Math.max(
                                avatar.naturalWidth,
                                avatar.naturalHeight
                            );

                        const scale =
                            AVATAR_SIZE / size;

                        const width =
                            avatar.naturalWidth *
                            scale;

                        const height =
                            avatar.naturalHeight *
                            scale;

                        ctx.drawImage(
                            avatar,

                            avatarX -
                            width / 2,

                            avatarY -
                            height / 2,

                            width,
                            height
                        );

                    } else {

                        /*
                         * Fallback while image loads.
                         */

                        ctx.fillStyle =
                            color;

                        ctx.fillRect(
                            avatarX -
                            AVATAR_SIZE / 2,

                            avatarY -
                            AVATAR_SIZE / 2,

                            AVATAR_SIZE,
                            AVATAR_SIZE
                        );
                    }

                    ctx.restore();


                    /*
                     * Name.
                     */

                    ctx.font =
                        "14px sans-serif";

                    ctx.textAlign =
                        "left";

                    ctx.textBaseline =
                        "middle";

                    ctx.fillStyle =
                        color;

                    ctx.fillText(
                        name,

                        avatarX +
                        AVATAR_SIZE / 2 +
                        TEXT_GAP,

                        y
                    );
                });

                ctx.restore();
            }
        };


        /*
         * ------------------------------------------------------------
         * 11. PLAYER UI
         * ------------------------------------------------------------
         *
         * We keep your existing player HTML/classes so your
         * existing CSS continues to control its appearance.
         * ------------------------------------------------------------
         */

        const canvas =
            document.getElementById(
                "weeklyLineChartDynamic"
            );

        const oldPlayer =
            chartContainer.querySelector(
                ".moving-average-player"
            );

        if (oldPlayer) {
            oldPlayer.remove();
        }


        const player =
            document.createElement("div");

        player.className =
            "moving-average-player";


        player.innerHTML = `
        <button
            type="button"
            class="moving-average-play"
            title="Play / Pause"
        >
            ▶
        </button>

        <button
            type="button"
            class="moving-average-restart"
            title="Restart"
        >
            ↻
        </button>

        <input
            type="range"
            class="moving-average-slider"
            min="${firstFrame}"
            max="${lastFrame}"
            value="${firstFrame}"
            step="1"
        />

        <span class="moving-average-date">
            ${currentWeek}
        </span>
    `;

        chartContainer.appendChild(player);


        /*
         * ------------------------------------------------------------
         * 12. PLAYER ELEMENTS
         * ------------------------------------------------------------
         */

        const playButton =
            player.querySelector(
                ".moving-average-play"
            );

        const restartButton =
            player.querySelector(
                ".moving-average-restart"
            );

        const slider =
            player.querySelector(
                ".moving-average-slider"
            );

        const dateLabel =
            player.querySelector(
                ".moving-average-date"
            );


        /*
         * ------------------------------------------------------------
         * 13. INITIAL TOP 8
         * ------------------------------------------------------------
         */

        const initialTopPeople =
            getTopPeople(firstFrame);


        /*
         * ------------------------------------------------------------
         * 14. DATASETS
         * ------------------------------------------------------------
         */

        const datasets =
            Array.from(
                {length: TOP_N},
                (_, slotIndex) => {

                    const entry =
                        initialTopPeople[
                            slotIndex
                            ];

                    return {

                        label:
                            entry
                                ? entry.person.name
                                : "",

                        data:
                            entry
                                ? movingAverages[
                                    entry.personIndex
                                    ].slice(
                                    firstFrame -
                                    DISPLAY_WEEKS +
                                    1,

                                    firstFrame + 1
                                )
                                : [],

                        borderColor:
                            entry
                                ? colors[
                                    entry.personIndex
                                    ]
                                : "#999",

                        backgroundColor:
                            entry
                                ? colors[
                                    entry.personIndex
                                    ]
                                : "#999",

                        borderWidth: 2,

                        tension: 0.3,

                        pointRadius: 0,

                        pointHoverRadius: 6,

                        spanGaps: false,
                    };
                }
            );


        /*
         * ------------------------------------------------------------
         * 15. INITIAL VISIBLE WEEKS
         * ------------------------------------------------------------
         */

        const initialStart =
            firstFrame -
            DISPLAY_WEEKS +
            1;

        const initialEnd =
            firstFrame + 1;


        /*
         * ------------------------------------------------------------
         * 16. CREATE CHART
         * ------------------------------------------------------------
         */

        const ctx =
            canvas.getContext("2d");


        movingAvgChartDynamic =
            new Chart(ctx, {

                type: "line",

                data: {

                    labels:
                        allWeeks.slice(
                            initialStart,
                            initialEnd
                        ),

                    datasets:
                    datasets
                },


                plugins: [
                    currentWeekPlugin,
                    lineLabelsPlugin
                ],


                options: {

                    responsive: true,

                    maintainAspectRatio: false,


                    layout: {

                        padding: {

                            top: 45,

                            /*
                             * Room for:
                             * connector + DP + name
                             */

                            right: 150
                        }
                    },


                    animation: {

                        duration:
                        STEP_TIME,

                        easing:
                            "linear"
                    },


                    interaction: {

                        mode:
                            "nearest",

                        intersect:
                            false
                    },


                    plugins: {

                        legend: {

                            display:
                                false
                        },


                        tooltip: {

                            callbacks: {

                                label: ctx =>
                                    `${ctx.dataset.label}: ${ctx.formattedValue}`
                            }
                        }
                    },


                    scales: {

                        x: {

                            title: {

                                display:
                                    true,

                                text:
                                    "Week"
                            },


                            grid: {

                                display:
                                    false
                            }
                        },


                        y: {

                            type:
                                "logarithmic",

                            /*
                             * Fixed for entire animation.
                             */

                            min:
                            yMin,

                            max:
                            yMax,


                            title: {

                                display:
                                    true,

                                text:
                                    "Messages (7-week avg)"
                            },


                            ticks: {

                                callback:
                                    val =>
                                        Number(
                                            val
                                        ).toLocaleString()
                            }
                        }
                    }
                }
            });


        /*
         * ------------------------------------------------------------
         * 17. UPDATE FRAME
         * ------------------------------------------------------------
         */

        function updateFrame(
            frame,
            animate = true
        ) {

            frame =
                Math.max(
                    firstFrame,
                    Math.min(
                        lastFrame,
                        frame
                    )
                );


            currentFrame =
                frame;


            currentWeek =
                allWeeks[frame];


            /*
             * Five visible weeks.
             */

            const start =
                frame -
                DISPLAY_WEEKS +
                1;

            const end =
                frame + 1;


            /*
             * Top 8 at THIS frame.
             */

            const topPeople =
                getTopPeople(frame);


            /*
             * Player.

             */

            dateLabel.textContent =
                currentWeek;

            slider.value =
                frame;


            /*
             * X-axis.
             */

            movingAvgChartDynamic
                .data
                .labels =
                allWeeks.slice(
                    start,
                    end
                );


            /*
             * Update the 8 slots.
             */

            for (
                let slotIndex = 0;
                slotIndex < TOP_N;
                slotIndex++
            ) {

                const dataset =
                    datasets[slotIndex];

                const entry =
                    topPeople[slotIndex];


                /*
                 * No person for this slot.
                 */

                if (!entry) {

                    dataset.label =
                        "";

                    dataset.data =
                        [];

                    /*
                     * Keep a valid color.
                     * There are no points, so nothing gets drawn.
                     */

                    dataset.borderColor =
                        "#999";

                    dataset.backgroundColor =
                        "#999";

                    continue;
                }


                /*
                 * Person currently occupying
                 * this ranking slot.
                 */

                dataset.label =
                    entry.person.name;


                /*
                 * Stable person color.
                 */

                dataset.borderColor =
                    colors[
                        entry.personIndex
                        ];

                dataset.backgroundColor =
                    colors[
                        entry.personIndex
                        ];


                /*
                 * Five visible 7-week moving-average points.
                 */

                dataset.data =
                    movingAverages[
                        entry.personIndex
                        ].slice(
                        start,
                        end
                    );
            }


            /*
             * Update.
             */

            movingAvgChartDynamic.update(
                animate
                    ? undefined
                    : "none"
            );
        }


        /*
         * ------------------------------------------------------------
         * 18. PLAY
         * ------------------------------------------------------------
         */

        async function play() {

            if (isPlaying) {
                return;
            }


            /*
             * Start over if already at the end.
             */

            if (
                currentFrame >=
                lastFrame
            ) {

                updateFrame(
                    firstFrame,
                    false
                );
            }


            isPlaying =
                true;

            playButton.textContent =
                "⏸";


            const token =
                ++animationToken;


            while (
                isPlaying &&
                currentFrame <
                lastFrame &&
                token ===
                animationToken
                ) {

                const nextFrame =
                    currentFrame + 1;


                updateFrame(
                    nextFrame,
                    true
                );


                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            STEP_TIME
                        )
                );
            }


            /*
             * Finished.
             */

            if (
                currentFrame >=
                lastFrame
            ) {

                isPlaying =
                    false;

                playButton.textContent =
                    "▶";
            }
        }


        /*
         * ------------------------------------------------------------
         * 19. PAUSE
         * ------------------------------------------------------------
         */

        function pause() {

            isPlaying =
                false;

            animationToken++;


            if (
                movingAvgChartDynamic
            ) {

                movingAvgChartDynamic.stop();
            }


            playButton.textContent =
                "▶";
        }


        /*
         * ------------------------------------------------------------
         * 20. PLAY / PAUSE
         * ------------------------------------------------------------
         */

        playButton.addEventListener(
            "click",
            () => {

                if (isPlaying) {
                    pause();
                } else {
                    play();
                }
            }
        );


        /*
         * ------------------------------------------------------------
         * 21. RESTART
         * ------------------------------------------------------------
         */

        restartButton.addEventListener(
            "click",
            () => {

                pause();

                updateFrame(
                    firstFrame,
                    false
                );
            }
        );


        /*
         * ------------------------------------------------------------
         * 22. SEEK
         * ------------------------------------------------------------
         */

        slider.addEventListener(
            "input",
            () => {

                pause();

                updateFrame(
                    Number(slider.value),
                    false
                );
            }
        );
    }

    async function renderMovingAverageChart(people) {
        if (movingAvgChart) {
            movingAvgChart.destroy();
            movingAvgChart = null;
        }
        // Extract labels (weeks)
        const allWeeks = Array.from(
            new Set(
                people.flatMap(p => Object.keys(p.chat_times.weekly_moving_avg))
            )
        ).sort();

        const ctx = document.getElementById("weeklyLineChart").getContext("2d");

        const top10People = people
            .sort((a, b) => b.chats - a.chats) // sort by chats descending
            .slice(0, 10);                     // take top 10

        const datasets = await Promise.all(
            top10People.map(async (p, idx) => {
                const avgMap = p.chat_times.weekly_moving_avg;
                const values = allWeeks.map(w => avgMap[w] || null);

                const color = `hsl(${(idx * 360 / people.length)}, 70%, 55%)`;

                return {
                    label: p.name,
                    data: values,
                    borderColor: color,
                    backgroundColor: color,
                    borderWidth: 2,
                    tension: 0.3,
                    pointRadius: 0,
                    pointHoverRadius: 6,
                };
            })
        );

        movingAvgChart = new Chart(ctx, {
            type: "line",
            data: {
                labels: allWeeks,
                datasets: datasets,
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: "nearest",
                    intersect: false,
                },
                plugins: {
                    legend: {display: false},
                    tooltip: {
                        callbacks: {
                            label: (ctx) => `${ctx.dataset.label}: ${ctx.formattedValue}`,
                        },
                    },
                },
                scales: {
                    x: {
                        title: {display: true, text: "Week"},
                        grid: {display: false},
                    },
                    y: {
                        type: "logarithmic",
                        title: {display: true, text: "Messages (3-week avg)"},
                        beginAtZero: false,
                        ticks: {
                            callback: (val) => Number(val).toLocaleString(),
                        },
                    },
                },
            },
        });
    }

    function renderCircles(people) {
        // Clear previous avatars
        document.getElementById("orbit1").innerHTML = "";
        document.getElementById("orbit2").innerHTML = "";
        document.getElementById("orbit3").innerHTML = "";

        // Sort by chats descending
        people.sort((a, b) => b.chats - a.chats);

        const orbits = [
            {id: "orbit1", count: 3},
            {id: "orbit2", count: 5},
            {id: "orbit3", count: 7},
        ];

        let startIdx = 0;
        orbits.forEach((o) => {
            const orbit = document.getElementById(o.id);
            const count = o.count;
            for (let i = 0; i < count && startIdx < people.length; i++) {
                const person = people[startIdx++];
                const angle = (360 / count) * i;
                const img = document.createElement("img");
                img.src = person.dp;
                img.alt = person.name;
                img.title = `${person.name} (${person.chats} chats)`;
                img.style.top = `${50 - 50 * Math.cos((angle * Math.PI) / 180)}%`;
                img.style.left = `${50 + 50 * Math.sin((angle * Math.PI) / 180)}%`;

                img.addEventListener("click", () => {
                    updateCommonWords(person.name, start_date, end_date);
                });

                orbit.appendChild(img);
            }
        });
    }

    let charts = [];
    let movingAvgChart = null;
    let movingAvgChartDynamic = null;

    async function updateCommonWords(name, start_date, end_date) {
        const container = document.getElementById("word-cloud-container");
        container.innerHTML = `<p style="color:#bbb">Loading ${name}'s words...</p>`;

        if (charts.length > 0) {
            charts.forEach(chart => chart.destroy());
            charts = [];
        }

        try {
            const query = new URLSearchParams({start_date, end_date}).toString();
            const res = await fetch(`/user/stats/${encodeURIComponent(name)}?${query}`);
            if (!res.ok) throw new Error("Network response not ok");
            const data = await res.json();

            const personWords = data.words || [];
            const perHour = data.per_hour || [];
            const perWeekday = data.per_weekday || [];
            const perWeek = data.per_week || [];

            container.innerHTML = "";

            if (personWords.length === 0) {
                container.innerHTML = `<p style="color:#ccc">No data available for ${name}</p>`;
                return;
            }

            // --- Word Cloud ---
            const maxFreq = Math.max(...personWords.map(([_, c]) => c));
            WordCloud(container, {
                list: personWords,
                gridSize: 8,
                weightFactor: s => (s / maxFreq) * 40 + 10,
                fontFamily: 'Impact, sans-serif',
                color: () => {
                    const colors = ['#ff6b6b', '#ffd93d', '#6bc5ff', '#b26bff', '#6bff95'];
                    return colors[Math.floor(Math.random() * colors.length)];
                },
                rotateRatio: 0.5,
                backgroundColor: 'transparent'
            });

            // --- Charts ---
            renderBarChart("chart-hourly", "Messages per Hour", perHour.labels, perHour.values);
            renderBarChart("chart-weekday", "Messages per Day", perWeekday.labels, perWeekday.values);
            renderBarChart("chart-weekly", "Messages per Week", perWeek.labels, perWeek.values);

        } catch (err) {
            console.error("Error fetching user stats:", err);
            container.innerHTML = `<p style="color:#f66">Failed to load data for ${name}</p>`;
        }
    }

    function renderBarChart(id, label, labels, data) {
        const ctx = document.getElementById(id);
        if (!ctx) return;

        charts.push(new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: label,
                    data: data,
                    borderRadius: 6,
                    borderSkipped: false,
                    backgroundColor: '#9aa0a6' // fallback before gradient applied
                }]
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        grid: {display: false},
                        ticks: {color: '#999'}
                    },
                    y: {
                        grid: {color: '#333'},
                        ticks: {color: '#777'}
                    }
                },
                plugins: {legend: {display: false}}
            },
            plugins: [{
                id: 'metalGradient',
                beforeDatasetsDraw(chart) {
                    const {ctx, chartArea} = chart;
                    if (!chartArea) return; // wait until chart area is ready

                    const gradient = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
                    gradient.addColorStop(0, '#d7d9db');  // lighter metallic tone
                    gradient.addColorStop(0.5, '#a8aaad'); // mid-tone
                    gradient.addColorStop(1, '#5f6368');  // darker base

                    chart.data.datasets[0].backgroundColor = gradient;
                }
            }]
        }));
    }

    // Handle range selection
    rangeSelect.addEventListener("change", () => {
        if (rangeSelect.value === "custom") {
            customInputs.style.display = "flex";
        } else {
            customInputs.style.display = "none";
            loadData();
        }
    });

    // Handle custom date input
    toDate.addEventListener("change", () => {
        if (rangeSelect.value === "custom" && fromDate.value && toDate.value) {
            loadData();
        }
    });

    async function loadAdminUser() {
        const res = await fetch(`/user/admin`);
        const data = await res.json();
        const centerAvatar = document.getElementById("center-avatar");
        centerAvatar.src = '/user/dp/' + data.display_name;
        centerAvatar.addEventListener("click", () => {
            updateCommonWords(data.display_name, start_date, end_date);
        });

    }

    // Initial load
    loadData();
    loadAdminUser();

</script>
