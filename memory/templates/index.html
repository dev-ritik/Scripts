{% extends "base.html" %}

{% block title %}Home | Memory Aggregator{% endblock %}

{% block extra_style %}

{% endblock %}

{% block extra_head %}
<link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

<script type="module" src="{{ url_for('static', filename='js/chatRenderer.js') }}"></script>

<script async src="//www.instagram.com/embed.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    function getUrlParameter(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    async function seekMemories() {
        const range = document.getElementById('range').value;
        let {start_date, end_date} = getDateRange(range) || {};

        if (range === 'custom') {
            start_date = document.getElementById('fromDate').value;
            end_date = document.getElementById('toDate').value;
        }

        if (!start_date || !end_date) {
            alert("Please select a valid date range.");
            return;
        }

        const searchRegex = document.getElementById('searchRegex').value.trim();
        const group = document.getElementById('group').checked;
        const exclude_system_messages = document.getElementById('exclude_system').checked;
        const selectedProviders = Array.from(document.querySelectorAll('.provider-option.selected'))
            .map(el => el.textContent.trim());

        const selectedPeoples = Array.from(document.querySelectorAll('.sender-checkbox:checked')).map(cb => cb.value);
        const container = document.getElementById('chatContainer');

        let queryParams = new URLSearchParams();
        queryParams.set("group", group);
        queryParams.set("exclude_system_messages", exclude_system_messages);
        queryParams.set("start_date", start_date);
        queryParams.set("end_date", end_date);

        if (searchRegex) {
            queryParams.set("search", encodeURIComponent(searchRegex));
        }

        if (selectedProviders.length === 0) {
            container.innerHTML = '<p>Please select providers</p>';
            return;
        }

        queryParams.set("providers", selectedProviders.join(","));

        if (selectedPeoples.length > 0) {
            queryParams.set("peoples", selectedPeoples.join(","));
        }

        container.innerHTML = '<p>Loading memories...</p>';

        try {
            const response = await fetch(`/chat_data?${queryParams.toString()}`);
            const events = await response.json();
            window.renderChat(events);
        } catch (err) {
            console.error('Error loading chat data:', err);
            container.innerHTML = '<p>Failed to load memories.</p>';
        }
    }

    // Helper: format date as YYYY-MM-DD
    function formatDate(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    // Get start & end dates for preset ranges
    function getDateRange(range) {
        const today = new Date();
        let start, end;

        switch (range) {
            case "week":
                end = new Date(today);
                start = new Date();
                start.setDate(end.getDate() - 7);
                break;

            case "month":
                end = new Date(today);
                start = new Date(today.getFullYear(), today.getMonth() - 1, today.getDate());
                break;

            case "quarter":
                end = new Date(today);
                start = new Date(today.getFullYear(), today.getMonth() - 3, today.getDate());
                break;

            case "2020":
            case "2021":
            case "2022":
            case "2023":
            case "2024":
            case "2025":
            case "2026":
                start = new Date(parseInt(range), 0, 1);
                end = new Date(parseInt(range), 11, 31);
                break;

            default:
                if (range.endsWith("yearago") || range.endsWith("yearsago")) {
                    const num = parseInt(range);

                    const targetDate = new Date(today);
                    targetDate.setFullYear(today.getFullYear() - num);

                    start = new Date(targetDate);
                    start.setDate(targetDate.getDate() - 1);

                    end = new Date(targetDate);
                    end.setDate(targetDate.getDate() + 1);

                    return {
                        start_date: formatDate(start),
                        end_date: formatDate(end)
                    };
                }
                return null;
        }

        return {
            start_date: formatDate(start),
            end_date: formatDate(end)
        };
    }

    function formatMessageDate(dateObj) {
        const now = new Date();

        // Remove time for comparison
        const d1 = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
        const d2 = new Date(now.getFullYear(), now.getMonth(), now.getDate());

        const diffDays = Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));

        if (diffDays === 0)
            return "Today";
        if (diffDays === 1)
            return "Yesterday";

        // If same week
        const currWeekDay = now.getDay();  // 0=Sun
        if (diffDays <= currWeekDay)
            return dateObj.toLocaleDateString([], { weekday: 'long' });

        if (dateObj.getFullYear() === now.getFullYear())
            return dateObj.toLocaleDateString([], {
                weekday: 'short',   // Tue
                day: 'numeric',     // 7
                month: 'short'      // Oct
            });

        // Older
        return dateObj.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }); // 15 Aug 2022
    }

    function insertDateDividerIfNeeded(container, ns, datetime) {
        const messageDate = new Date(datetime);
        const messageDateKey = messageDate.toDateString();

        if (ns.lastRenderedDate !== messageDateKey) {
            // New date – insert a divider
            ns.lastRenderedDate = messageDateKey;

            const divider = document.createElement("div");
            divider.className = "date-divider";
            divider.textContent = formatMessageDate(messageDate);

            container.appendChild(divider);
        }
    }

    async function renderSenders() {
        const container = document.getElementById('senders-container');
        container.innerHTML = ''; // Sanitize framework loop

        // Initialize the WhatsApp Themed Command Buttons bar
        const buttonContainer = document.createElement('div');
        buttonContainer.className = 'select-buttons';

        const selectAllBtn = document.createElement('button');
        selectAllBtn.type = 'button';
        selectAllBtn.className = 'btn-select-all'; // Teal primary setup
        selectAllBtn.textContent = 'Select All';
        selectAllBtn.onclick = function () {
            container.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
        };

        const clearAllBtn = document.createElement('button');
        clearAllBtn.type = 'button';
        clearAllBtn.className = 'btn-clear-all'; // Balanced bordered contrast setup
        clearAllBtn.textContent = 'Clear All';
        clearAllBtn.onclick = function () {
            container.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        };

        buttonContainer.appendChild(selectAllBtn);
        buttonContainer.appendChild(clearAllBtn);
        container.parentNode.insertBefore(buttonContainer, container.nextSibling);

        // Dynamic user loop injection
        const peoples = await loadPeople();
        peoples.forEach(people => {
            const name = people.display_name;
            const initial = name[0]?.toUpperCase() || '';
            const encodedName = encodeURIComponent(name);

            const row = document.createElement('label');
            row.className = 'user-select-row';
            row.innerHTML = `
                <input type="checkbox" value="${name}" class="sender-checkbox">
                <div class="user-avatar-frame">
                    <img src="/user/dp/${encodedName}"
                         style="width:100%; height:100%; object-fit:cover; border-radius:50%;"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="user-avatar-fallback" style="display:none;">
                        ${initial}
                    </div>
                </div>
                <span class="user-display-name">${name}</span>
            `;
            container.appendChild(row);
        });
    }
    document.addEventListener('DOMContentLoaded', async function () {
        const rangeSelect = document.getElementById('range');
        const customDateInputs = document.getElementById('customDateInputs');

        rangeSelect.addEventListener('change', function () {
            if (this.value === 'custom') {
                customDateInputs.style.display = 'flex';
            } else {
                customDateInputs.style.display = 'none';
            }
        });

        const groupParam = getUrlParameter('group');
        document.getElementById('group').checked = groupParam === null || groupParam === 'true';

        await renderSenders();

        fetch("/available_providers")
            .then(r => r.json())
            .then(providers => {
                const container = document.getElementById("providersContainer");
                const urlProvidersParam = getUrlParameter('providers');
                const selectedProviders = urlProvidersParam ? urlProvidersParam.split(",") : [];

                providers.forEach(provider => {
                    const optionDiv = document.createElement("div");
                    optionDiv.className = "provider-option";
                    if (selectedProviders.includes(provider)) optionDiv.classList.add("selected");

                    const img = document.createElement("img");
                    img.className = "provider-logo";
                    img.src = provider[1]
                    img.onerror = () => img.style.display = "none";

                    const label = document.createElement("span");
                    label.textContent = provider[0];

                    optionDiv.appendChild(img);
                    optionDiv.appendChild(label);

                    optionDiv.onclick = () => {
                        optionDiv.classList.toggle("selected");
                    };

                    container.appendChild(optionDiv);
                });
            });
    });
</script>
{% endblock %}

{% block content %}
<div class="form-container">
    <!-- existing form unchanged -->
    <form id="memoryForm" onsubmit="return false;">
        <div class="form-group">
            <div class="dropdown">
                <label for="range">📅 Select Range:</label>
                <select id="range">
                    <option value="week">This Week</option>
                    <option value="month">This Month</option>
                    <option value="quarter">This Quarter</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                    <option value="2020">2020</option>
                    <option disabled>──────────────</option>
                    <option value="1yearago">1 Year Ago Today</option>
                    <option value="2yearsago">2 Years Ago Today</option>
                    <option value="3yearsago">3 Years Ago Today</option>
                    <option value="4yearsago">4 Years Ago Today</option>
                    <option value="5yearsago">5 Years Ago Today</option>
                    <option value="10yearsago">10 Years Ago Today</option>
                    <option value="15yearsago">15 Years Ago Today</option>
                    <option disabled>──────────────</option>
                    <option value="custom">Custom Range</option>
                </select>

                <div class="custom-date-range" id="customDateInputs">
                    <label>From:</label>
                    <input type="date" id="fromDate">
                    <label>To:</label>
                    <input type="date" id="toDate">
                </div>
            </div>

            <div class="checkbox-wrapper">
                <input type="checkbox" id="group" name="group" checked>
                <label for="group">
                    <i class="fas fa-users"></i>
                    Show Group Messages
                </label>
                <input type="checkbox" id="exclude_system" name="exclude_system" checked>
                <label for="exclude_system">
                    <i class="fas fa-users"></i>
                    Exclude System Messages
                </label>
            </div>
        </div>
        <div class="select-wrapper">
            <i class="fas fa-search"></i>
            <label for="searchRegex">Search (Regex):</label>
            <input type="text" id="searchRegex" placeholder="e.g. (?i)\britik\b"/>
        </div>

        <div class="form-group">
            <div class="select-wrapper">
                <label><i class="fas fa-user"></i>Select Senders:</label>
                <div id="senders-container" class="custom-multiselect-container"></div>
            </div>

            <div class="select-wrapper">
                <label for="providers"><i class="fas fa-database"></i>Select Providers:</label>
                <div id="providersContainer" class="providers-container"></div>
            </div>
        </div>
        <div class="button-group">
            <button type="button" onclick="seekMemories()">
                <i class="fas fa-search"></i> Seek Memories
            </button>
        </div>
    </form>
</div>

<div id="chatContainer" class="chat-container"></div>
{% endblock %}
